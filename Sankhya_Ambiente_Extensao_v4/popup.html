<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sankhya - Ambiente</title>
    <style>
        body {
            width: 270px;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            color: #222;
            font-family: Arial, Helvetica, sans-serif;
        }
        h3 { margin: 0 0 14px; font-size: 17px; }
        #status {
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            text-align: center;
            font-size: 13px;
        }
        #status.prd { background: #c90000; }
        #status.tst { background: #079b32; }
        #status.unknown { background: #666; }
        #address {
            margin-top: 12px;
            color: #555;
            font-size: 11px;
            overflow-wrap: anywhere;
            line-height: 1.4;
        }
        p {
            margin: 12px 0 0;
            color: #666;
            font-size: 11px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <h3>Sankhya</h3>
    <div id="status" class="unknown">Verificando ambiente...</div>
    <div id="address"></div>
    <p>A identificação é feita automaticamente pelo endereço e pela porta do servidor.</p>
    <script src="popup.js"></script>
</body>
</html>
